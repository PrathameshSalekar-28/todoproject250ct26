<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .todo-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #id_msg {
            font-size: 14px;
            min-height: 20px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .msg-error {
            color: #dc2626;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 14px 16px;
            font-size: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .task-name {
            word-break: break-word;
        }

        .col-action {
            width: 90px;
            text-align: right;
        }

        .btn-delete {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .btn-delete:hover {
            background-color: #dc2626;
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 24px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Todo Application</h1>

        <form class="todo-form" onsubmit="save(event)">
            <input
                type="text"
                id="id_task"
                class="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
            />
            <input
                type="submit"
                id="id_btn"
                class="btn-submit"
                value="Add Task"
            />
        </form>

        <div id="id_msg"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Task</th>
                        <th class="col-action">Action</th>
                    </tr>
                </thead>
                <tbody id="id_info">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function save(event) {
            event.preventDefault();

            let task = document.getElementById("id_task");
            let btn = document.getElementById("id_btn");
            let msg = document.getElementById("id_msg");

            if (task.value.trim() === "") {
                alert("Task cannot be empty");
                msg.textContent = "";
                task.focus();
                return;
            }

            btn.disabled = true;
            msg.textContent = "";

            let url = "https://todoapp250ct26.onrender.com/save";
            let data = {
                task: task.value
            };

            let options = {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            };

            fetch(url, options)
                .then(res => res.text())
                .then(data => {
                    alert(data);
                    task.value = "";
                    task.focus();
                    btn.disabled = false;
                    findAll();
                })
                .catch(err => {
                    msg.className = "msg-error";
                    msg.textContent = "Issue: " + err;
                    btn.disabled = false;
                });
        }

        function findAll() {
            let info = document.getElementById("id_info");
            let url = "https://todoapp250ct26.onrender.com/findall";

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        info.innerHTML = `<tr><td colspan="2" class="empty-state">No tasks found. Add one above!</td></tr>`;
                        return;
                    }

                    let output = "";
                    for (let i = 0; i < data.length; i++) {
                        output += "<tr>";
                        output += "<td class='task-name'>" + data[i].task + "</td>";
                        output += "<td class='col-action'>";
                        output += "<button class='btn-delete' onclick='delData(" + data[i].id + ")'>Delete</button>";
                        output += "</td>";
                        output += "</tr>";
                    }

                    info.innerHTML = output;
                })
                .catch(err => {
                    console.log("Issue: " + err);
                });
        }

        function delData(id) {
            if (confirm("Are you sure you want to delete this task?")) {
                let url = "https://todoapp250ct26.onrender.com/deletebyid/" + id;
                let options = {
                    method: "DELETE"
                };

                fetch(url, options)
                    .then(res => res.text())
                    .then(data => {
                        alert(data);
                        findAll();
                    })
                    .catch(err => {
                        console.log("Issue: " + err);
                    });
            }
        }

        findAll();
    </script>
</body>
</html>
